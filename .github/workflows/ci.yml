# Docket's checks. Every step is tool/ci.sh, so `tool/ci.sh` runs exactly this locally.
name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      # Desert Ant's models from source (tool/build_desert_ant.sh): mise runs Desert Ant's build, which fetches its
      # Swift toolchain, Swift Android SDK and NDK once; all cached until the patches change.
      - uses: jdx/mise-action@v2
        with:
          install: false
      - uses: actions/cache@v4
        with:
          path: |
            android/app/libs
            .build/desert-ant-core
            ~/.cache/desert-ant
            ~/.swiftpm
          key: desert-ant-${{ hashFiles('third_party/desert-ant-core-patches/000*.patch', 'tool/build_desert_ant.sh') }}
      - name: Checks
        run: tool/ci.sh
