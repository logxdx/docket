# A release on a v* tag: the APK (the Phonon models in it; the Desert Ant ones downloaded in the app), on GitHub Releases.
# Every step is tool/release.sh, so `tool/release.sh vX.Y.Z --publish` does exactly this locally.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # At job level, so a step's `if` can see whether a release key is set.
      KEYSTORE_B64: ${{ secrets.DOCKET_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      # Align and Title from source (tool/build_desert_ant.sh): mise runs Desert Ant's build, which fetches its
      # Swift toolchain, Swift Android SDK and NDK once; all cached until the patches change.
      - uses: jdx/mise-action@v2
        with:
          install: false
      - uses: actions/cache@v4
        with:
          path: |
            android/app/libs
            .build/desert-ant-core
            ~/.cache/desert-ant
            ~/.swiftpm
          key: desert-ant-${{ hashFiles('third_party/desert-ant-core-patches/000*.patch', 'tool/build_desert_ant.sh') }}
      - name: Signing key
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/docket.jks"
          echo "DOCKET_KEYSTORE=$RUNNER_TEMP/docket.jks" >> "$GITHUB_ENV"
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKET_KEYSTORE_PASSWORD: ${{ secrets.DOCKET_KEYSTORE_PASSWORD }}
          DOCKET_KEY_ALIAS: ${{ secrets.DOCKET_KEY_ALIAS }}
          DOCKET_KEY_PASSWORD: ${{ secrets.DOCKET_KEY_PASSWORD }}
        run: tool/release.sh "${{ github.event.inputs.version || github.ref_name }}" --publish
