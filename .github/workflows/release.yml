# A release on a v* tag: the APK (every model but Voz) and the Voz pack, on GitHub Releases.
# Every step is tool/release.sh, so `tool/release.sh vX.Y.Z --publish` does exactly this locally.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (vX.Y.Z)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Signing key
        if: ${{ env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.DOCKET_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/docket.jks"
          echo "DOCKET_KEYSTORE=$RUNNER_TEMP/docket.jks" >> "$GITHUB_ENV"
      - name: Build and publish
        env:
          GH_TOKEN: ${{ github.token }}
          DOCKET_KEYSTORE_PASSWORD: ${{ secrets.DOCKET_KEYSTORE_PASSWORD }}
          DOCKET_KEY_ALIAS: ${{ secrets.DOCKET_KEY_ALIAS }}
          DOCKET_KEY_PASSWORD: ${{ secrets.DOCKET_KEY_PASSWORD }}
        run: tool/release.sh "${{ github.event.inputs.version || github.ref_name }}" --publish
